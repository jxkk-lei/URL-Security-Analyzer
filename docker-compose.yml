
services:
  postgres:
    image: postgres:17-alpine
    container_name: usa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: url_security_analyzer
      POSTGRES_USER: usa_user
      POSTGRES_PASSWORD: usa_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usa_user -d url_security_analyzer"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
